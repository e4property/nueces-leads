name: Nueces Scrape and Deploy

on:
  # Re-enabled 2026-08-09 after a clean test run post-fix.
  schedule:
    - cron: '0 14 * * 1,4'   # Mon/Thu 9am CST (14:00 UTC)
    - cron: '0 20 * * 1,4'   # Mon/Thu 3pm CST (20:00 UTC)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  deployments: read
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Tesseract OCR
        run: |
          for i in 1 2 3 4 5; do
            sudo apt-get -o Acquire::Retries=3 -o Acquire::ForceIPv4=true install -y tesseract-ocr && exit 0
            sudo apt-get -o Acquire::Retries=3 -o Acquire::ForceIPv4=true update || true
            sudo apt-get -o Acquire::Retries=3 -o Acquire::ForceIPv4=true install -y tesseract-ocr && exit 0
            echo "apt attempt $i failed, waiting 45s"; sleep 45
          done
          exit 1

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml selenium webdriver-manager homeharvest pytesseract pillow

      - name: Run Nueces scraper
        env:
          CLERK_EMAIL: "${{ secrets.CLERK_EMAIL }}"
          CLERK_PASSWORD: "${{ secrets.CLERK_PASSWORD }}"
        run: python scraper/fetch.py 2>&1 | tee /tmp/nueces.log
        continue-on-error: false

      - name: Commit records
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add dashboard/records.json 2>/dev/null || true
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore: update nueces leads $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3 4 5; do
            sleep $((RANDOM % 10 + 2))
            git fetch origin main
            git rebase -X theirs origin/main || git rebase --abort
            git push origin main && echo "Push succeeded" && break
            echo "Attempt $i failed, retrying..."
          done

      - name: Clean up stale github-pages artifacts
        if: always()
        env:
          GH_TOKEN: "${{ secrets.GH_PAT }}"
        run: |
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
            --jq '.artifacts[] | select(.name=="github-pages") | .id' | \
          while read -r id; do
            echo "Deleting stale github-pages artifact id=$id"
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id" || true
          done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/

      - name: Clear stuck Pages deployments
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for sha in $(curl -s -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/deployments?environment=github-pages&per_page=5" | grep -o '"sha": *"[0-9a-f]\{40\}"' | grep -o '[0-9a-f]\{40\}' | sort -u); do
            [ "$sha" = "$GITHUB_SHA" ] && continue
            code=$(curl -s -o /dev/null -w "%{http_code}" -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/pages/deployments/$sha/cancel")
            echo "cancel $sha -> $code"
          done
          sleep 5
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        id: pages_try1
        continue-on-error: true
      - name: Clear stuck Pages deployments (retry)
        if: steps.pages_try1.outcome == 'failure'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for sha in $(curl -s -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/deployments?environment=github-pages&per_page=5" | grep -o '"sha": *"[0-9a-f]\{40\}"' | grep -o '[0-9a-f]\{40\}' | sort -u); do
            code=$(curl -s -o /dev/null -w "%{http_code}" -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/pages/deployments/$sha/cancel")
            echo "cancel $sha -> $code"
          done
          sleep 5
      - name: Deploy to GitHub Pages (retry)
        if: steps.pages_try1.outcome == 'failure'
        uses: actions/deploy-pages@v4
