name: Nueces CAD Roll Download

on:
  # PAUSED 2026-08-06 per request -- schedule disabled, manual trigger still works.
  # Uncomment the schedule block below to resume automatic runs.
  # schedule:
  #   - cron: '0 12 5 4 *'    # April 5 at noon UTC
  #   - cron: '0 12 5 9 *'    # September 5 at noon UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download-roll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Download and process Nueces CAD roll
        run: python scraper/download_roll.py

      - name: Commit lookup CSV
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add scraper/nueces_lookup.csv.gz 2>/dev/null || true
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "data: update nueces CAD appraisal roll $(date -u +'%Y-%m-%d')"
          git push origin main
